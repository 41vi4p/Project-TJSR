# TJSR SearXNG config — used by the company background-check collectors.
# Both `formats: [html, json]` AND `limiter: false` are required, otherwise
# every backend request with format=json is rejected with 403.
use_default_settings: true

server:
  secret_key: "945800567dbe7ecf03cabb683f10736233fccbf7fda29c53e6371b6ce5a01a2f"
  limiter: false

search:
  formats:
    - html
    - json

# Extra engines beyond the defaults — when DuckDuckGo/Startpage/Brave suspend
# this instance's IP (CAPTCHA on query bursts), these keep results flowing.
engines:
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
