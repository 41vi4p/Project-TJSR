services:
  postgres:
    image: postgres:16-alpine
    container_name: tjsr-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tjsr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tjsr_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tjsr_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tjsr}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tjsr-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: tjsr-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tjsr-network

  redis:
    image: redis:7-alpine
    container_name: tjsr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tjsr-network

  searxng:
    image: searxng/searxng:latest
    container_name: tjsr-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - tjsr-network

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

networks:
  tjsr-network:
    driver: bridge
